<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#030712" />

  <!-- Top Hero Header -->
  <rect x="0" y="0" width="1200" height="150" fill="url(#headerGrad)" />
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#f59e0b" stroke-width="2" opacity="0.6" />

  <!-- Logo Icon -->
  <rect x="48" y="32" width="76" height="76" rx="18" fill="#020617" stroke="url(#goldGrad)" stroke-width="2.5" />
  <text x="86" y="86" font-family="'Noto Sans Gujarati', sans-serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">વ</text>

  <!-- Title & Subtitle -->
  <text x="144" y="66" font-family="'Cinzel', 'Playfair Display', serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="1">VADODARA 3D: ICONIC PLACES &amp; HERITAGE</text>
  <text x="144" y="98" font-family="system-ui, sans-serif" font-size="15" fill="#f59e0b" font-weight="600">વડોદરા ૩ડી • SANSKARINAGARI ARCHITECTURAL VIRTUAL TOUR • GDG DEVFEST '26</text>
  <text x="144" y="122" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Interactive WebGL Three.js experience honoring Maharaja Sayajirao Gaekwad III's visionary city</text>

  <!-- Badge on Right -->
  <rect x="1000" y="44" width="150" height="52" rx="12" fill="#020617" stroke="#f59e0b" stroke-width="1.5" />
  <text x="1075" y="66" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="bold">7 LANDMARKS</text>
  <text x="1075" y="85" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">100% WebGL 3D</text>

  <!-- ================= 6 MONUMENT CARDS GRID ================= -->

  <!-- Card 1: Laxmi Vilas Palace -->
  <g filter="url(#shadow)" transform="translate(48, 175)">
    <rect width="350" height="180" rx="14" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#f59e0b" fill-opacity="0.2" />
    <text x="36" y="42" font-size="16" text-anchor="middle">👑</text>
    <text x="64" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Laxmi Vilas Palace</text>
    <text x="64" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b">લક્ષ્મી વિલાસ પેલેસ • Built 1890</text>
    <text x="24" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1" width="300">4x size of Buckingham Palace (500+ acres). Indo-Saracenic masterpiece with 300ft clock tower, Belgian glass &amp; Venetian mosaics.</text>
    <rect x="24" y="140" width="95" height="24" rx="6" fill="#1e293b" />
    <text x="71" y="156" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Major Mant</text>
    <rect x="128" y="140" width="115" height="24" rx="6" fill="#1e293b" />
    <text x="185" y="156" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Ravi Varma Studio</text>
  </g>

  <!-- Card 2: Sursagar Lake & Golden Shiva -->
  <g filter="url(#shadow)" transform="translate(425, 175)">
    <rect width="350" height="180" rx="14" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#f59e0b" fill-opacity="0.2" />
    <text x="36" y="42" font-size="16" text-anchor="middle">🔱</text>
    <text x="64" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Sursagar Lake &amp; Shiva</text>
    <text x="64" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b">સુરસાગર તળાવ • 111-ft Idol</text>
    <text x="24" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">The spiritual heart of old Baroda with the colossal 111-foot gold-plated Sarveshwar Mahadev standing gracefully atop the rippling lake.</text>
    <rect x="24" y="140" width="105" height="24" rx="6" fill="#1e293b" />
    <text x="76" y="156" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">111 ft Gilded</text>
    <rect x="138" y="140" width="125" height="24" rx="6" fill="#1e293b" />
    <text x="200" y="156" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Maha Shivratri Hub</text>
  </g>

  <!-- Card 3: Sayaji Baug & Floral Clock -->
  <g filter="url(#shadow)" transform="translate(802, 175)">
    <rect width="350" height="180" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#10b981" fill-opacity="0.2" />
    <text x="36" y="42" font-size="16" text-anchor="middle">🌺</text>
    <text x="64" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Sayaji Baug (Kamati)</text>
    <text x="64" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">સયાજી બાગ • Built 1879</text>
    <text x="24" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">113-acre botanical sanctuary with India's iconic 20-ft working Floral Clock, heritage mini steam toy train loop, and planetarium dome.</text>
    <rect x="24" y="140" width="100" height="24" rx="6" fill="#1e293b" />
    <text x="74" y="156" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">20-ft Floral Dial</text>
    <rect x="133" y="140" width="115" height="24" rx="6" fill="#1e293b" />
    <text x="190" y="156" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Toy Train Track</text>
  </g>

  <!-- Card 4: Kirti Mandir -->
  <g filter="url(#shadow)" transform="translate(48, 380)">
    <rect width="350" height="180" rx="14" fill="#0f172a" stroke="#e11d48" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#e11d48" fill-opacity="0.2" />
    <text x="36" y="42" font-size="16" text-anchor="middle">🏛️</text>
    <text x="64" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Kirti Mandir (Cenotaph)</text>
    <text x="64" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e">કીર્તિ મંદિર • Built 1936</text>
    <text x="24" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">'E'-shaped stone cenotaph with a 35m sun-crested shikhara on Vishwamitri River. Houses legendary murals by Nandalal Bose.</text>
    <rect x="24" y="140" width="95" height="24" rx="6" fill="#1e293b" />
    <text x="71" y="156" font-family="monospace" font-size="10" fill="#f43f5e" text-anchor="middle">Nandalal Bose</text>
    <rect x="128" y="140" width="110" height="24" rx="6" fill="#1e293b" />
    <text x="183" y="156" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">35m Sun Shikhara</text>
  </g>

  <!-- Card 5: Nyay Mandir -->
  <g filter="url(#shadow)" transform="translate(425, 380)">
    <rect width="350" height="180" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#0284c7" fill-opacity="0.2" />
    <text x="36" y="42" font-size="16" text-anchor="middle">⚖️</text>
    <text x="64" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Nyay Mandir (Justice)</text>
    <text x="64" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">ન્યાય મંદિર • Built 1896</text>
    <text x="24" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Chisholm's Indo-Saracenic &amp; Gothic high court featuring towering clock gable, Byzantine rose window and Maharani Chimnabai plinth.</text>
    <rect x="24" y="140" width="95" height="24" rx="6" fill="#1e293b" />
    <text x="71" y="156" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Robert Chisholm</text>
    <rect x="128" y="140" width="110" height="24" rx="6" fill="#1e293b" />
    <text x="183" y="156" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Gothic Rose Win</text>
  </g>

  <!-- Card 6: EME Temple & Pavagadh -->
  <g filter="url(#shadow)" transform="translate(802, 380)">
    <rect width="350" height="180" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="36" y="42" font-size="16" text-anchor="middle">🛕</text>
    <text x="64" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">EME Temple &amp; Pavagadh</text>
    <text x="64" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc">દક્ષિણામૂર્તિ &amp; પાવાગઢ યુનેસ્કો</text>
    <text x="24" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">World's unique aluminum geodesic dome temple of 5 faiths, plus Pavagadh's UNESCO volcanic hill peak with flying cable car ropeway.</text>
    <rect x="24" y="140" width="110" height="24" rx="6" fill="#1e293b" />
    <text x="79" y="156" font-family="monospace" font-size="10" fill="#c084fc" text-anchor="middle">Aluminum Geodesic</text>
    <rect x="143" y="140" width="110" height="24" rx="6" fill="#1e293b" />
    <text x="198" y="156" font-family="monospace" font-size="10" fill="#f97316" text-anchor="middle">Ropeway Cable Car</text>
  </g>

  <!-- ================= BOTTOM INTERACTIVE FEATURES BAR ================= -->
  <g transform="translate(48, 590)">
    <rect width="1104" height="150" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    
    <!-- Feature 1: 3D Engine -->
    <g transform="translate(40, 30)">
      <circle cx="20" cy="20" r="18" fill="#f59e0b" fill-opacity="0.15" />
      <text x="20" y="26" font-size="16" text-anchor="middle">🌐</text>
      <text x="50" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Three.js WebGL Engine</text>
      <text x="50" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Procedural PBR materials, shadows, orbit controls &amp; 3D beacons</text>
    </g>

    <!-- Feature 2: Day/Night & Weather -->
    <g transform="translate(390, 30)">
      <circle cx="20" cy="20" r="18" fill="#38bdf8" fill-opacity="0.15" />
      <text x="20" y="26" font-size="16" text-anchor="middle">⛅</text>
      <text x="50" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Dynamic Atmosphere</text>
      <text x="50" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Golden hour, Dev Deepavali night illumination &amp; monsoon rain</text>
    </g>

    <!-- Feature 3: Web Audio Synth -->
    <g transform="translate(740, 30)">
      <circle cx="20" cy="20" r="18" fill="#ec4899" fill-opacity="0.15" />
      <text x="20" y="26" font-size="16" text-anchor="middle">🎵</text>
      <text x="50" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Web Audio Synthesizer</text>
      <text x="50" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Harmonic Indian Tanpura drone &amp; generative temple bell chimes</text>
    </g>

    <!-- Feature 4: Radar & Quiz -->
    <g transform="translate(40, 85)">
      <circle cx="20" cy="20" r="18" fill="#10b981" fill-opacity="0.15" />
      <text x="20" y="26" font-size="16" text-anchor="middle">🧭</text>
      <text x="50" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">City Radar Map &amp; Teleport</text>
      <text x="50" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Spatial map of Baroda with Vishwamitri river &amp; highway corridors</text>
    </g>

    <!-- Feature 5: Photobooth Souvenir -->
    <g transform="translate(390, 85)">
      <circle cx="20" cy="20" r="18" fill="#f97316" fill-opacity="0.15" />
      <text x="20" y="26" font-size="16" text-anchor="middle">📸</text>
      <text x="50" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Souvenir Postcard Photobooth</text>
      <text x="50" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">High-res canvas capture framed with Baroda royal crest</text>
    </g>

    <!-- Feature 6: Heritage Quiz -->
    <g transform="translate(740, 85)">
      <circle cx="20" cy="20" r="18" fill="#eab308" fill-opacity="0.15" />
      <text x="20" y="26" font-size="16" text-anchor="middle">🏆</text>
      <text x="50" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Sanskarinagari Challenge</text>
      <text x="50" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">5-stage interactive quiz with confetti &amp; royal scholar badge</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="775" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">
    Vadodara 3D • Crafted for GDG DevFest Baroda 2026 • Live at http://localhost:5173/
  </text>
</svg>
