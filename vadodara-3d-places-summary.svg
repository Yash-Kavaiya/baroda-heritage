pace" font-size="12" text-anchor="middle">100% WebGL 3D</text><g filter="url(#shadow)" transform="translate(48, 175)"><rect width="350" height="180" fill="#0f172a" stroke="#d97706" stroke-width="1.5" rx="14"/><circle cx="36" cy="36" r="16" fill="#f59e0b" fill-opacity=".2"/><text x="36" y="42" font-size="16" text-anchor="middle">👑</text><text x="64" y="34" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Laxmi Vilas Palace</text><text x="64" y="50" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11">લક્ષ્મી વિલાસ પેલેસ • Built 1890</text><text width="300" x="24" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">4x size of Buckingham Palace (500+ acres). Indo-Saracenic masterpiece with 300ft clock tower, Belgian glass &amp; Venetian mosaics.</text><rect width="95" height="24" x="24" y="140" fill="#1e293b" rx="6"/><text x="71" y="156" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">Major Mant</text><rect width="115" height="24" x="128" y="140" fill="#1e293b" rx="6"/><text x="185" y="156" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Ravi Varma Studio</text></g><g filter="url(#shadow)" transform="translate(425, 175)"><rect width="350" height="180" fill="#0f172a" stroke="#d97706" stroke-width="1.5" rx="14"/><circle cx="36" cy="36" r="16" fill="#f59e0b" fill-opacity=".2"/><text x="36" y="42" font-size="16" text-anchor="middle">🔱</text><text x="64" y="34" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Sursagar Lake &amp; Shiva</text><text x="64" y="50" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11">સુરસાગર તળાવ • 111-ft Idol</text><text x="24" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">The spiritual heart of old Baroda with the colossal 111-foot gold-plated Sarveshwar Mahadev standing gracefully atop the rippling lake.</text><rect width="105" height="24" x="24" y="140" fill="#1e293b" rx="6"/><text x="76" y="156" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">111 ft Gilded</text><rect width="125" height="24" x="138" y="140" fill="#1e293b" rx="6"/><text x="200" y="156" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Maha Shivratri Hub</text></g><g filter="url(#shadow)" transform="translate(802, 175)"><rect width="350" height="180" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="14"/><circle cx="36" cy="36" r="16" fill="#10b981" fill-opacity=".2"/><text x="36" y="42" font-size="16" text-anchor="middle">🌺</text><text x="64" y="34" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Sayaji Baug (Kamati)</text><text x="64" y="50" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">સયાજી બાગ • Built 1879</text><text x="24" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">113-acre botanical sanctuary with India&apos;s iconic 20-ft working Floral Clock, heritage mini steam toy train loop, and planetarium dome.</text><rect width="100" height="24" x="24" y="140" fill="#1e293b" rx="6"/><text x="74" y="156" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">20-ft Floral Dial</text><rect width="115" height="24" x="133" y="140" fill="#1e293b" rx="6"/><text x="190" y="156" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Toy Train Track</text></g><g filter="url(#shadow)" transform="translate(48, 380)"><rect width="350" height="180" fill="#0f172a" stroke="#e11d48" stroke-width="1.5" rx="14"/><circle cx="36" cy="36" r="16" fill="#e11d48" fill-opacity=".2"/><text x="36" y="42" font-size="16" text-anchor="middle">🏛️</text><text x="64" y="34" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Kirti Mandir (Cenotaph)</text><text x="64" y="50" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11">કીર્તિ મંદિર • Built 1936</text><text x="24" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">&apos;E&apos;-shaped stone cenotaph with a 35m sun-crested shikhara on Vishwamitri River. Houses legendary murals by Nandalal Bose.</text><rect width="95" height="24" x="24" y="140" fill="#1e293b" rx="6"/><text x="71" y="156" fill="#f43f5e" font-family="monospace" font-size="10" text-anchor="middle">Nandalal Bose</text><rect width="110" height="24" x="128" y="140" fill="#1e293b" rx="6"/><text x="183" y="156" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">35m Sun Shikhara</text></g><g filter="url(#shadow)" transform="translate(425, 380)"><rect width="350" height="180" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" rx="14"/><circle cx="36" cy="36" r="16" fill="#0284c7" fill-opacity=".2"/><text x="36" y="42" font-size="16" text-anchor="middle">⚖️</text><text x="64" y="34" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Nyay Mandir (Justice)</text><text x="64" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">ન્યાય મંદિર • Built 1896</text><text x="24" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Chisholm&apos;s Indo-Saracenic &amp; Gothic high court featuring towering clock gable, Byzantine rose window and Maharani Chimnabai plinth.</text><rect width="95" height="24" x="24" y="140" fill="#1e293b" rx="6"/><text x="71" y="156" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Robert Chisholm</text><rect width="110" height="24" x="128" y="140" fill="#1e293b" rx="6"/><text x="183" y="156" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">Gothic Rose Win</text></g><g filter="url(#shadow)" transform="translate(802, 380)"><rect width="350" height="180" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" rx="14"/><circle cx="36" cy="36" r="16" fill="#8b5cf6" fill-opacity=".2"/><text x="36" y="42" font-size="16" text-anchor="middle">🛕</text><text x="64" y="34" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">EME Temple &amp; Pavagadh</text><text x="64" y="50" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11">દક્ષિણામૂર્તિ &amp; પાવાગઢ યુનેસ્કો</text><text x="24" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">World&apos;s unique aluminum geodesic dome temple of 5 faiths, plus Pavagadh&apos;s UNESCO volcanic hill peak with flying cable car ropeway.</text><rect width="110" height="24" x="24" y="140" fill="#1e293b" rx="6"/><text x="79" y="156" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">Aluminum Geodesic</text><rect width="110" height="24" x="143" y="140" fill="#1e293b" rx="6"/><text x="198" y="156" fill="#f97316" font-family="monospace" font-size="10" text-anchor="middle">Ropeway Cable Car</text></g><g transform="translate(48, 590)"><rect width="1104" height="150" fill="#0f172a" stroke="#334155" stroke-width="1" rx="16"/><g transform="translate(40, 30)"><circle cx="20" cy="20" r="18" fill="#f59e0b" fill-opacity=".15"/><text x="20" y="26" font-size="16" text-anchor="middle">🌐</text><text x="50" y="18" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Three.js WebGL Engine</text><text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Procedural PBR materials, shadows, orbit controls &amp; 3D beacons</text></g><g transform="translate(390, 30)"><circle cx="20" cy="20" r="18" fill="#38bdf8" fill-opacity=".15"/><text x="20" y="26" font-size="16" text-anchor="middle">⛅</text><text x="50" y="18" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Dynamic Atmosphere</text><text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Golden hour, Dev Deepavali night illumination &amp; monsoon rain</text></g><g transform="translate(740, 30)"><circle cx="20" cy="20" r="18" fill="#ec4899" fill-opacity=".15"/><text x="20" y="26" font-size="16" text-anchor="middle">🎵</text><text x="50" y="18" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Web Audio Synthesizer</text><text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Harmonic Indian Tanpura drone &amp; generative temple bell chimes</text></g><g transform="translate(40, 85)"><circle cx="20" cy="20" r="18" fill="#10b981" fill-opacity=".15"/><text x="20" y="26" font-size="16" text-anchor="middle">🧭</text><text x="50" y="18" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">City Radar Map &amp; Teleport</text><text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Spatial map of Baroda with Vishwamitri river &amp; highway corridors</text></g><g transform="translate(390, 85)"><circle cx="20" cy="20" r="18" fill="#f97316" fill-opacity=".15"/><text x="20" y="26" font-size="16" text-anchor="middle">📸</text><text x="50" y="18" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Souvenir Postcard Photobooth</text><text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">High-res canvas capture framed with Baroda royal crest</text></g><g transform="translate(740, 85)"><circle cx="20" cy="20" r="18" fill="#eab308" fill-opacity=".15"/><text x="20" y="26" font-size="16" text-anchor="middle">🏆</text><text x="50" y="18" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Sanskarinagari Challenge</text><text x="50" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">5-stage interactive quiz with confetti &amp; royal scholar badge</text></g></g><text x="600" y="775" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Vadodara 3D • Crafted for GDG DevFest Baroda 2026 • Live at http://localhost:5173/</text></svg>